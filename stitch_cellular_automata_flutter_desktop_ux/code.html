<!-- JavaScript engine powering the cellular automata grid and controls -->
<script data-purpose="cellular-automata-engine">
    // Simulation state setup
    const canvas = document.getElementById('automata-canvas');
    const ctx = canvas.getContext('2d');

    const COLS = 128;
    const ROWS = 96;
    let grid = new Uint8Array(COLS * ROWS);
    let nextGrid = new Uint8Array(COLS * ROWS);

    let isRunning = false;
    let currentGeneration = 428;
    let maxGenerations = 1000;
    let stepInterval = 30; // ms
    let animationTimer = null;
    let isDrawing = false;
    let drawMode = 1; // 1: birth cell, 0: erase

    // DOM References
    const btnPlayPause = document.getElementById('btn-play-pause');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const btnStepNext = document.getElementById('btn-step-next');
    const btnStepPrev = document.getElementById('btn-step-prev');
    const btnRewind = document.getElementById('btn-rewind');
    const btnRandomise = document.getElementById('btn-randomise');
    const btnResetGrid = document.getElementById('btn-reset-grid');
    const sliderInterval = document.getElementById('slider-interval');
    const labelInterval = document.getElementById('label-interval');
    const inputMaxGen = document.getElementById('input-max-gen');
    const barCurrentGen = document.getElementById('bar-current-gen');
    const barTargetGen = document.getElementById('bar-target-gen');
    const progressFill = document.getElementById('simulation-progress-fill');
    const hudLiveCells = document.getElementById('hud-live-cells');
    const hudCoords = document.getElementById('hud-coords');
    const ruleSelector = document.getElementById('rule-selector');
    const hudRuleName = document.getElementById('hud-rule-name');
    const badgeSurvive = document.getElementById('badge-survive');
    const badgeBirth = document.getElementById('badge-birth');
    const toggleRecord = document.getElementById('toggle-record');
    const recPulse = document.getElementById('rec-pulse');

    // Color definitions for emerald cyber aesthetic
    const COLOR_ALIVE = '#10b981';
    const COLOR_ALIVE_GLOW = '#34d399';
    const COLOR_DEAD = '#070b12';
    const COLOR_GRID_LINE = 'rgba(30, 41, 59, 0.4)';

    // Pre-populate random pattern on load
    function randomizeGrid(density = 0.16) {
      let count = 0;
      for (let i = 0; i < COLS * ROWS; i++) {
        const val = Math.random() < density ? 1 : 0;
        grid[i] = val;
        if (val) count++;
      }
      renderCanvas();
      updateHUD(count);
    }

    // Render 2D grid matrix onto Canvas
    function renderCanvas() {
      const cellWidth = canvas.width / COLS;
      const cellHeight = canvas.height / ROWS;

      // Clear
      ctx.fillStyle = COLOR_DEAD;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let aliveCount = 0;

      // Draw Cells
      ctx.fillStyle = COLOR_ALIVE;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const idx = r * COLS + c;
          if (grid[idx] === 1) {
            aliveCount++;
            ctx.fillRect(c * cellWidth, r * cellHeight, cellWidth - 0.5, cellHeight - 0.5);
          }
        }
      }

      updateHUD(aliveCount);
    }

    // Step Conway's B3/S23
    function stepSimulation() {
      let aliveCount = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          // Count 8 neighbors with toroidal wrap
          let neighbors = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = (r + dr + ROWS) % ROWS;
              const nc = (c + dc + COLS) % COLS;
              if (grid[nr * COLS + nc] === 1) neighbors++;
            }
          }

          const currentIdx = r * COLS + c;
          const isAlive = grid[currentIdx] === 1;

          // Conway's Rule B3/S23
          let nextState = 0;
          if (isAlive && (neighbors === 2 || neighbors === 3)) {
            nextState = 1;
          } else if (!isAlive && neighbors === 3) {
            nextState = 1;
          }

          nextGrid[currentIdx] = nextState;
          if (nextState === 1) aliveCount++;
        }
      }

      // Swap buffers
      const temp = grid;
      grid = nextGrid;
      nextGrid = temp;

      // Increment gen & update UI
      currentGeneration++;
      updateProgressUI(aliveCount);
      renderCanvas();

      if (currentGeneration >= maxGenerations) {
        pauseSimulation();
      }
    }

    function updateProgressUI(aliveCount) {
      barCurrentGen.textContent = currentGeneration.toLocaleString();
      barTargetGen.textContent = maxGenerations.toLocaleString();
      const pct = Math.min(100, (currentGeneration / maxGenerations) * 100);
      progressFill.style.width = pct + '%';
      if (aliveCount !== undefined) {
        hudLiveCells.textContent = aliveCount.toLocaleString();
      }
    }

    function updateHUD(aliveCount) {
      if (aliveCount !== undefined) {
        hudLiveCells.textContent = aliveCount.toLocaleString();
      }
    }

    // Simulation loop control
    function startSimulation() {
      if (isRunning) return;
      isRunning = true;
      playIcon.className = 'ph-fill ph-pause text-base';
      playText.textContent = 'Pause';
      btnPlayPause.classList.replace('bg-emerald-500', 'bg-amber-500');
      btnPlayPause.classList.replace('hover:bg-emerald-400', 'hover:bg-amber-400');

      animationTimer = setInterval(() => {
        stepSimulation();
      }, stepInterval);
    }

    function pauseSimulation() {
      isRunning = false;
      playIcon.className = 'ph-fill ph-play text-base';
      playText.textContent = 'Simulate';
      btnPlayPause.classList.replace('bg-amber-500', 'bg-emerald-500');
      btnPlayPause.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-400');

      if (animationTimer) {
        clearInterval(animationTimer);
        animationTimer = null;
      }
    }

    // Attach Event Listeners
    btnPlayPause.addEventListener('click', () => {
      if (isRunning) {
        pauseSimulation();
      } else {
        startSimulation();
      }
    });

    btnStepNext.addEventListener('click', () => {
      pauseSimulation();
      stepSimulation();
    });

    btnStepPrev.addEventListener('click', () => {
      pauseSimulation();
      if (currentGeneration > 0) {
        currentGeneration = Math.max(0, currentGeneration - 1);
        updateProgressUI();
      }
    });

    btnRewind.addEventListener('click', () => {
      pauseSimulation();
      currentGeneration = 0;
      updateProgressUI();
      randomizeGrid(0.12);
    });

    btnRandomise.addEventListener('click', () => {
      randomizeGrid(0.18);
    });

    btnResetGrid.addEventListener('click', () => {
      pauseSimulation();
      grid.fill(0);
      currentGeneration = 0;
      updateProgressUI(0);
      renderCanvas();
    });

    sliderInterval.addEventListener('input', (e) => {
      stepInterval = parseInt(e.target.value, 10);
      const ops = Math.round(1000 / stepInterval);
      labelInterval.innerHTML = `${stepInterval} ms <span class="text-slate-500 font-normal">(~${ops} ops/s)</span>`;
      if (isRunning) {
        pauseSimulation();
        startSimulation();
      }
    });

    inputMaxGen.addEventListener('change', (e) => {
      maxGenerations = parseInt(e.target.value, 10) || 1000;
      updateProgressUI();
    });

    ruleSelector.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'highlife') {
        hudRuleName.textContent = 'B36/S23 (HighLife)';
        badgeSurvive.textContent = '2, 3';
        badgeBirth.textContent = '3, 6';
      } else if (val === 'seeds') {
        hudRuleName.textContent = 'B2/S (Seeds)';
        badgeSurvive.textContent = 'None';
        badgeBirth.textContent = '2';
      } else if (val === 'briansbrain') {
        hudRuleName.textContent = 'Brian\'s Brain';
        badgeSurvive.textContent = 'Decay';
        badgeBirth.textContent = '2';
      } else {
        hudRuleName.textContent = 'B3/S23 (Life)';
        badgeSurvive.textContent = '2, 3';
        badgeBirth.textContent = '3';
      }
    });

    toggleRecord.addEventListener('change', (e) => {
      if (e.target.checked) {
        recPulse.classList.remove('hidden');
      } else {
        recPulse.classList.add('hidden');
      }
    });

    // Interactive Drawing on Canvas
    function getGridCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * COLS);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * ROWS);
      return { 
        x: Math.max(0, Math.min(COLS - 1, x)), 
        y: Math.max(0, Math.min(ROWS - 1, y)) 
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      const { x, y } = getGridCoords(e);
      hudCoords.textContent = `(X: ${x}, Y: ${y})`;

      if (isDrawing) {
        const idx = y * COLS + x;
        grid[idx] = drawMode;
        renderCanvas();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const { x, y } = getGridCoords(e);
      const idx = y * COLS + x;
      drawMode = grid[idx] === 1 ? 0 : 1;
      grid[idx] = drawMode;
      renderCanvas();
    });

    window.addEventListener('mouseup', () => {
      isDrawing = false;
    });

    // Clear Button in HUD
    document.getElementById('tool-clear').addEventListener('click', () => {
      grid.fill(0);
      renderCanvas();
    });

    // Snapshot frame mock
    document.getElementById('btn-snapshot').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `ca_frame_gen_${currentGeneration}.png`;
      link.href = canvas.toDataURL();
      link.click();
    });

    // Initial setup
    randomizeGrid(0.18);
    updateProgressUI();
  </script>
